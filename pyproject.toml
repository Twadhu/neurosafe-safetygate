[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosafe-safetygate"
version = "1.0.0"
description = "A confidence-aware safety layer for EEG-controlled assistive robots."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Abdullah Faisal Abdo Othman Abbas"}]
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
eeg = ["mne>=1.7", "scikit-learn>=1.4", "scipy>=1.11", "joblib>=1.3"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]
all = [
  "mne>=1.7",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "streamlit>=1.38",
  "plotly>=5.24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
neurosafe = "neurosafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

